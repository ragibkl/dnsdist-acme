[package]
name = "dnsdist-acme"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
aws-lc-rs = "1.18.1"
axum = "0.8.9"
axum-macros = "0.5.1"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3"
handlebars = "6.4.4"
hickory-proto = "0.26"
rustls = "0.23"
rustls-acme = { version = "0.15.4", features = ["tokio", "tower"] }
serde = { version ="1.0", features = ["derive"] }
serde_yaml = "0.9.34"  # DEPRECATED upstream -- see TODO.md
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["fs", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
