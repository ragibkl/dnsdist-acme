name: dnsdist-acme Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # Quick checks that need no compile: formatting, and RustSec advisories
  # against Cargo.lock (also run daily by advisories.yml).
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Use the same Rust version as .tool-versions, so local checks and CI agree.
      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt

      - name: Dockerfile Rust matches .tool-versions
        run: |
          docker_rust=$(sed -nE 's/^FROM rust:([0-9.]+)-alpine.* AS builder$/\1/p' Dockerfile)
          echo "Dockerfile rust:$docker_rust, .tool-versions ${{ steps.rust.outputs.version }}"
          test "$docker_rust" = "${{ steps.rust.outputs.version }}"

      - name: cargo fmt
        run: cargo fmt --check

      - name: Security advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Runs before anything is published. The end-to-end test in particular guards
  # a class of bug that compiles cleanly, emits no warning, and fails only
  # against a real ACME server -- the axum path-parameter syntax differs between
  # 0.7 (`:token`) and 0.8 (`{token}`), and getting it wrong means every
  # challenge 404s, the certificate never issues, dnsdist never starts, and the
  # node serves no DNS at all. That bug reached a built image twice during
  # development and only this test caught it.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # amd64 only and cached, so the unit tests and the end-to-end run share
      # one compile rather than paying for it twice.
      - name: Build builder stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          load: true
          tags: dnsdist-acme:ci-builder
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max

      - name: Unit tests and clippy
        run: |
          docker run --rm dnsdist-acme:ci-builder sh -c '
            rustup component add clippy &&
            cargo test --release &&
            cargo clippy --all-targets --release -- -D warnings
          '

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dnsdist-acme:ci
          cache-from: type=gha,scope=linux-amd64
          # Always rebuild the runtime stage: alpine:3.24 rarely changes digest,
          # so a cached `apk add dnsdist` layer kept shipping dnsdist 2.0.8 after
          # Alpine moved to 2.0.12 (PowerDNS advisory 2026-15).
          no-cache-filters: runtime
          pull: true

      - name: Show bundled dnsdist version
        run: docker run --rm --entrypoint dnsdist dnsdist-acme:ci --version | head -1

      - name: End-to-end ACME test against Pebble
        env:
          DNSDIST_ACME_IMAGE: dnsdist-acme:ci
        run: ./tests/e2e/run.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -p dnsdist-acme-e2e -f tests/e2e/docker-compose.yml logs --tail 60 || true

  # One native runner per platform (no emulation), each pushing its image by
  # digest; the merge job then publishes the multi-arch tags.
  build:
    # Nothing is published unless the checks above pass.
    needs: [lint, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ragibkl/dnsdist-acme,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          # Always rebuild the runtime stage: alpine:3.24 rarely changes digest,
          # so a cached `apk add dnsdist` layer kept shipping dnsdist 2.0.8 after
          # Alpine moved to 2.0.12 (PowerDNS advisory 2026-15).
          no-cache-filters: runtime
          pull: true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ragibkl/dnsdist-acme
          tags: |
            # default setups
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            # set latest tag for master branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ragibkl/dnsdist-acme@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ragibkl/dnsdist-acme:${{ steps.meta.outputs.version }}
