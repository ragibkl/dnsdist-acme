name: dnsdist-acme Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # Runs before anything is published. The end-to-end test in particular guards
  # a class of bug that compiles cleanly, emits no warning, and fails only
  # against a real ACME server -- the axum path-parameter syntax differs between
  # 0.7 (`:token`) and 0.8 (`{token}`), and getting it wrong means every
  # challenge 404s, the certificate never issues, dnsdist never starts, and the
  # node serves no DNS at all. That bug reached a built image twice during
  # development and only this test caught it.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only and cached, so the unit tests and the end-to-end run share
      # one compile rather than paying for it twice.
      - name: Build builder stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          load: true
          tags: dnsdist-acme:ci-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests and clippy
        run: |
          docker run --rm dnsdist-acme:ci-builder sh -c '
            apk add --quiet rust-clippy &&
            cargo test --release &&
            cargo clippy --all-targets --release -- -D warnings
          '

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dnsdist-acme:ci
          cache-from: type=gha

      - name: End-to-end ACME test against Pebble
        env:
          DNSDIST_ACME_IMAGE: dnsdist-acme:ci
        run: ./tests/e2e/run.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -p dnsdist-acme-e2e -f tests/e2e/docker-compose.yml logs --tail 60 || true

  build:
    # Nothing is published unless the tests above pass.
    needs: test
    runs-on: ubuntu-latest

    # Permissions to use OIDC token authentication
    permissions:
      contents: read
      id-token: write
      # Allows pushing to the GitHub Container Registry
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ragibkl/dnsdist-acme
          tags: |
            # default setups
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            # set latest tag for master branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - uses: depot/setup-action@v1

      - uses: depot/build-push-action@v1
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386,linux/arm/v7
          project: 83rwjkn7g4
          push: true
          tags: ${{ steps.meta.outputs.tags }}
